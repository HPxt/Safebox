name: SafeBox
options:
  bundleIdPrefix: app.safebox
  deploymentTarget:
    iOS: "16.0"
packages:
  SafeBoxCore:
    path: ../SafeBoxCore
targets:
  SafeBoxApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    dependencies:
      - package: SafeBoxCore
        product: SafeBoxCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.safebox.ios
        INFOPLIST_FILE: Sources/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Support/SafeBox.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
  SafeBoxAutoFillExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SafeBoxAutoFillExtension/Sources
    dependencies:
      - package: SafeBoxCore
        product: SafeBoxCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.safebox.ios.autofill
        INFOPLIST_FILE: SafeBoxAutoFillExtension/Sources/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: SafeBoxAutoFillExtension/Sources/Support/SafeBoxAutoFill.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
