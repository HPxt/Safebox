name: iOS Personal Staging IPA

on:
  pull_request:
    paths: ['ios/**', 'scripts/ios/**', 'scripts/ios-static-gate.mjs', '.github/workflows/ios-personal-staging.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-personal-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Static and packaging security tests
        run: |
          node scripts/ios-static-gate.mjs
          python3 -m unittest discover -s scripts/ios -p 'test_*.py'
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate independent personal staging project
        working-directory: ios/SafeBoxApp
        run: xcodegen generate --spec project.personal-staging.yml
      - name: Test personal staging configuration on simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild -project ios/SafeBoxApp/SafeBoxPersonalStaging.xcodeproj -scheme SafeBoxPersonalStaging -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/personal-tests.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Archive unsigned iPhone app without extensions
        run: >-
          xcodebuild -project ios/SafeBoxApp/SafeBoxPersonalStaging.xcodeproj
          -scheme SafeBoxPersonalStaging -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/personal.xcarchive"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Validate and package the device-only IPA
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/ios/package_personal_staging.py
          --app "$RUNNER_TEMP/personal.xcarchive/Products/Applications/SafeBoxPersonalStaging.app"
          --output "$RUNNER_TEMP/personal-artifact" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safebox-personal-staging-unsigned
          path: ${{ runner.temp }}/personal-artifact/
          retention-days: 7
          if-no-files-found: error
